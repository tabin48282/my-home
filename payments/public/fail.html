<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }</style>
</head>
<body>
  <h1>결제에 실패했습니다.</h1>
  <p id="detail"></p>
  <p><a href="/">다시 시도</a></p>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("detail").textContent = `${q.get("message") || ""} (${q.get("code") || ""})`;
  </script>
</body>
</html>
